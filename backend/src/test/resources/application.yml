spring:
  application:
    name: scalable-hotel-management-test
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/hotel_test_db
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/hotel_test_db
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms

server:
  port: 0

logging:
  level:
    com.hotel.system: INFO
    org.springframework.data.mongodb: WARN
